<section class="block rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="mb-4 flex items-center justify-between gap-3">
    <h3 class="text-lg font-semibold text-slate-900">{{ gridLabel() }}</h3>
  </div>

  <div [class]="'grid gap-4 ' + columnClass()">
    @for (item of children(); track item.id) {
      <app-block-renderer [node]="item" />
    }
  </div>
</section>
